<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Task Detail — Nauxica</title>
    <link rel="icon" href="assets/logo/favicon.ico" />
    <link rel="stylesheet" href="style.css?v=9999" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
      .td-back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.82rem;
        font-weight: 700;
        color: var(--etna-orange, #E85D04);
        text-decoration: none;
        margin-bottom: 8px;
      }

      .td-state-card {
        max-width: 480px;
        margin: 60px auto;
        text-align: center;
        padding: 32px 24px;
      }
      .td-state-card h2 { margin: 0 0 8px; font-size: 1.2rem; }
      .td-state-card p  { color: var(--stone); margin: 0 0 16px; }

      .td-header-card {
        padding: 22px 24px;
        margin-bottom: 16px;
      }
      .td-header-top {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--color-border-tertiary, rgba(29,35,39,0.07));
      }
      .td-property-name { font-size: 1.35rem; font-weight: 700; line-height: 1.2; }
      .td-task-title    { font-size: 0.95rem; color: var(--stone); margin-top: 2px; }
      .td-badges        { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

      .td-badge {
        display: inline-flex; align-items: center; height: 26px; padding: 0 11px;
        border-radius: 999px; font-size: 0.71rem; font-weight: 700; white-space: nowrap;
      }
      .td-badge-status-open        { background: rgba(120,113,108,0.12); color: #78716C; }
      .td-badge-status-assigned    { background: rgba(120,113,108,0.12); color: #78716C; }
      .td-badge-status-accepted    { background: rgba(0,110,182,0.12);   color: #006EB6; }
      .td-badge-status-in_progress { background: rgba(217,119,6,0.14);   color: #D97706; }
      .td-badge-status-completed   { background: rgba(26,140,78,0.14);   color: #1A8C4E; }
      .td-badge-status-cancelled   { background: rgba(192,57,43,0.12);   color: #C0392B; }
      .td-badge-priority-high   { background: rgba(192,57,43,0.12); color: #C0392B; }
      .td-badge-priority-normal { background: rgba(29,35,39,0.08);  color: var(--stone); }
      .td-badge-priority-low    { background: rgba(26,140,78,0.12); color: #1A8C4E; }
      .td-badge-priority-urgent { background: rgba(192,57,43,0.18); color: #7f1d1d; }

      .td-info-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px 20px;
      }
      .td-info-item  { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
      .td-info-label { font-size: 0.625rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--stone); }
      .td-info-value { font-size: 0.88rem; overflow-wrap: anywhere; }
      .td-info-muted { color: var(--stone); }

      .td-card       { padding: 20px 22px; margin-bottom: 16px; }
      .td-card-title { font-size: 0.95rem; font-weight: 700; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
      .td-card-title i { color: var(--etna-orange, #E85D04); font-size: 0.88rem; }

      .td-empty { font-size: 0.84rem; color: var(--stone); margin: 0; }

      .td-timeline-row {
        padding: 10px 0;
        border-bottom: 1px solid var(--color-border-tertiary, rgba(29,35,39,0.06));
      }
      .td-timeline-row:last-child { border-bottom: none; }
      .td-timeline-title { font-size: 0.85rem; font-weight: 600; }
      .td-timeline-desc  { font-size: 0.8rem; color: var(--stone); margin-top: 1px; }
      .td-timeline-time  { font-size: 0.72rem; color: var(--stone); margin-top: 3px; }

      .td-evidence-row {
        padding: 10px 0;
        border-bottom: 1px solid var(--color-border-tertiary, rgba(29,35,39,0.06));
      }
      .td-evidence-row:last-child { border-bottom: none; }
      .td-evidence-label { font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
      .td-evidence-meta  { font-size: 0.72rem; color: var(--stone); margin-top: 3px; display: flex; align-items: center; gap: 4px; }
      .td-evidence-note  { font-size: 0.8rem; color: var(--stone); margin-top: 3px; font-style: italic; }
      .td-evidence-done    { color: #1A8C4E; font-size: 0.72rem; font-weight: 700; display: inline-flex; align-items: center; gap: 3px; }
      .td-evidence-pending { color: var(--stone); font-size: 0.72rem; font-weight: 600; }

      .td-photo-row {
        display: flex; justify-content: space-between; align-items: center;
        padding: 7px 0;
        border-bottom: 1px solid var(--color-border-tertiary, rgba(29,35,39,0.06));
        font-size: 0.84rem;
      }
      .td-photo-row:last-child { border-bottom: none; }
      .td-photo-count { font-weight: 700; }

      .td-msg-list { max-height: 300px; overflow-y: auto; }
      .td-msg-row {
        padding: 9px 0;
        border-bottom: 1px solid var(--color-border-tertiary, rgba(29,35,39,0.06));
      }
      .td-msg-row:last-child { border-bottom: none; }
      .td-msg-sender { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--stone); }
      .td-msg-text   { font-size: 0.85rem; margin: 2px 0; overflow-wrap: anywhere; }
      .td-msg-time   { font-size: 0.72rem; color: var(--stone); margin-top: 2px; }

      .td-msg-compose {
        display: flex; gap: 8px; margin-top: 14px;
        padding-top: 12px; border-top: 1px solid var(--color-border-tertiary, rgba(29,35,39,0.07));
        align-items: flex-end;
      }
      .td-msg-input {
        flex: 1; padding: 8px 10px; border-radius: 10px; font-size: 0.85rem; line-height: 1.4;
        border: 1px solid var(--color-border-tertiary, rgba(29,35,39,0.15));
        background: var(--color-background-primary, #fff); color: inherit;
        font-family: inherit; resize: none; min-height: 36px;
      }
      .td-msg-send {
        height: 36px; padding: 0 16px; border-radius: 10px; border: none; cursor: pointer;
        background: var(--etna-orange, #E85D04); color: #fff; font-size: 0.82rem; font-weight: 700;
        white-space: nowrap; flex-shrink: 0;
      }
      .td-msg-send:hover:not(:disabled) { opacity: 0.9; }
      .td-msg-send:disabled { opacity: 0.6; cursor: default; }
      .td-conv-error {
        margin-top: 8px; padding: 6px 10px; border-radius: 8px; font-size: 0.78rem;
        background: rgba(192,57,43,0.08); color: #7f1d1d; border: 1px solid rgba(192,57,43,0.2);
      }

      .td-review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
      .td-review-confirm {
        display: inline-flex; align-items: center; gap: 6px;
        height: 36px; padding: 0 16px; border-radius: 10px; border: none;
        cursor: pointer; font-size: 0.82rem; font-weight: 700;
        background: #1A8C4E; color: #fff;
      }
      .td-review-confirm:hover:not(:disabled) { opacity: 0.9; }
      .td-review-confirm:disabled { opacity: 0.6; cursor: default; }
      .td-review-followup {
        display: inline-flex; align-items: center; gap: 6px;
        height: 36px; padding: 0 16px; border-radius: 10px;
        cursor: pointer; font-size: 0.82rem; font-weight: 700;
        background: transparent; color: var(--etna-orange, #E85D04);
        border: 1.5px solid var(--etna-orange, #E85D04);
      }
      .td-review-followup:hover { background: rgba(232,93,4,0.06); }
      .td-review-done {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: 0.82rem; font-weight: 700; color: #1A8C4E;
        background: rgba(26,140,78,0.1); border-radius: 999px;
        padding: 4px 12px; margin-bottom: 8px;
      }

      @media (max-width: 600px) {
        .td-info-grid    { grid-template-columns: 1fr; }
        .td-header-top   { flex-direction: column; }
      }
    </style>
  </head>
  <body class="homeowner-dashboard-page">

    <header class="nx-header app-top-header">
      <nav class="nx-nav">
        <a href="index.html" class="site-logo" aria-label="Nauxica home">
          <img src="assets/logo/nauxica-logo-horizontal.svg" alt="Nauxica" />
        </a>
        <button class="mobile-menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <ul class="nx-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="contacts.html">Contact</a></li>
          <li>
            <button class="btn app-logout-btn" type="button" id="logout-button">Logout</button>
          </li>
        </ul>
      </nav>
    </header>

    <main class="dashboard-shell homeowner-dashboard">
      <aside class="dashboard-sidebar" role="navigation" aria-label="Dashboard navigation">
        <div class="dashboard-sidebar-inner">
          <div class="sidebar-brand">Nauxica</div>
          <nav class="dashboard-nav"></nav>
        </div>
      </aside>

      <section class="dashboard-main">
        <div class="dashboard-topbar">
          <div class="topbar-left">
            <div class="eyebrow-label" id="workspace-label">Nauxica homeowner workspace</div>
            <a class="td-back-link" href="tasks.html">&#8592; Back to Tasks</a>
            <h1 class="dashboard-title">Task Detail</h1>
          </div>
          <div class="topbar-right">
            <div class="topbar-controls">
              <div class="profile-chip">
                <div class="avatar" id="profile-avatar">HO</div>
                <div class="profile-meta">
                  <strong id="profile-name">Homeowner</strong>
                  <span id="profile-role">Homeowner</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div id="tdRoot">
          <div class="dashboard-card td-state-card">
            <h2>Loading&hellip;</h2>
          </div>
        </div>
      </section>
    </main>

    <script src="nauxica-shared.js"></script>
    <script type="module" src="supabase-client.js"></script>
    <script src="nauxica-timeline.js"></script>

    <script>
      localStorage.setItem('accountType', 'homeowner');
      NauxicaShared.updateTopbar('homeowner');
      NauxicaShared.renderNav(document.querySelector('.dashboard-nav'), 'homeowner');
      NauxicaShared.setActivePage('tasks');

      document.addEventListener('DOMContentLoaded', function () {
        var mobileMenuBtn = document.querySelector('.mobile-menu-toggle');
        var header        = document.querySelector('.nx-header');
        if (mobileMenuBtn && header) {
          mobileMenuBtn.addEventListener('click', function () {
            var isOpen = header.classList.toggle('nav-open');
            mobileMenuBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
          });
        }
      });

      document.getElementById('logout-button')
        ?.addEventListener('click', NauxicaShared.handleLogout);
    </script>

    <script type="module">
      (async () => {
        var sb   = window.NauxicaSupabase;
        var root = document.getElementById('tdRoot');

        var { data: sessData } = await sb.auth.getSession();
        if (!sessData.session) { window.location.replace('login.html'); throw 0; }

        var taskId = new URLSearchParams(window.location.search).get('task_id');
        if (!taskId) {
          root.innerHTML =
            '<div class="dashboard-card td-state-card">' +
              '<h2>No task selected</h2>' +
              '<p>No task was specified in the link.</p>' +
              '<a class="td-back-link" href="tasks.html">&#8592; Return to Tasks</a>' +
            '</div>';
          throw 0;
        }

        function esc(s) {
          if (!s) return '';
          return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        var TASK_TYPE_LABELS = {
          cleaning: 'Cleaning', maintenance: 'Maintenance', inspection: 'Inspection',
          laundry: 'Laundry', guest_request: 'Guest request', other: 'Other',
          transfers: 'Transfers', experiences: 'Experiences'
        };

        var STATUS_LABEL = {
          open: 'Open', assigned: 'Assigned', accepted: 'Accepted',
          in_progress: 'In progress', completed: 'Completed', cancelled: 'Cancelled'
        };

        var PRIORITY_LABEL = { high: 'High', normal: 'Normal', low: 'Low', urgent: 'Urgent' };

        function statusBadge(status) {
          var label = STATUS_LABEL[status] || status;
          var cls   = STATUS_LABEL[status] ? status : 'open';
          return '<span class="td-badge td-badge-status-' + esc(cls) + '">' + esc(label) + '</span>';
        }

        function priorityBadge(priority) {
          var label = PRIORITY_LABEL[priority] || priority;
          var cls   = PRIORITY_LABEL[priority] ? priority : 'normal';
          return '<span class="td-badge td-badge-priority-' + esc(cls) + '">' + esc(label) + '</span>';
        }

        function fmtValue(amount, currency) {
          if (!amount) return null;
          var sym = currency === 'EUR' ? '€' : currency === 'USD' ? '$' : currency === 'GBP' ? '£' : (currency || 'EUR') + ' ';
          return sym + parseFloat(amount).toFixed(2);
        }

        function infoItem(label, value, fallback) {
          var display = (value != null && value !== '')
            ? '<span class="td-info-value">' + esc(String(value)) + '</span>'
            : '<span class="td-info-value td-info-muted">' + esc(fallback) + '</span>';
          return '<div class="td-info-item"><span class="td-info-label">' + esc(label) + '</span>' + display + '</div>';
        }

        // ── Load task ──────────────────────────────────────────────────────
        var { data: task, error: taskErr } = await sb
          .from('tasks')
          .select(
            'id, title, task_type, priority, status, due_date, description, ' +
            'task_value_amount, task_value_currency, property_id, reservation_id, ' +
            'assigned_partner_id, ' +
            'properties(display_name, address_city, address_province), ' +
            'reservations(guest_name, checkin_date, checkout_date), ' +
            'assigned_partner:users!assigned_partner_id(display_name, full_name, partner_service_types, is_identity_verified)'
          )
          .eq('id', taskId)
          .maybeSingle();

        if (taskErr) console.error('Task load error:', taskErr);
        if (!task) {
          root.innerHTML =
            '<div class="dashboard-card td-state-card">' +
              '<h2>Task not found</h2>' +
              '<p>This task does not exist or you do not have access to it.</p>' +
              '<a class="td-back-link" href="tasks.html">&#8592; Return to Tasks</a>' +
            '</div>';
          return;
        }

        var EVIDENCE_CHECK_LABEL = {
          property_accessed:              'Property accessed',
          work_completed:                 'Work completed',
          no_damage_or_issues:            'No damage or issues',
          photos_uploaded:                'Photos uploaded',
          issue_inspected:                'Issue inspected',
          repair_attempted_or_completed:  'Repair attempted or completed',
          follow_up_needed:               'Follow-up needed',
          items_collected_or_delivered:   'Items collected or delivered',
          issue_reported_if_any:          'Issue reported (if any)',
          guest_picked_up_or_dropped_off: 'Guest picked up or dropped off',
          delay_reported_if_any:          'Delay reported (if any)',
          guest_attended:                 'Guest attended',
          request_fulfilled:              'Request fulfilled'
        };

        var PHOTO_TYPE_LABEL = {
          before:     'Before',
          after:      'After',
          issue:      'Issue',
          completion: 'Completion',
          other:      'Other'
        };

        // Same ordered key lists as partner-job-detail.html — display order only,
        // no effect on what is stored in the DB.
        var EVIDENCE_CHECK_KEYS = {
          cleaning:      ['property_accessed', 'work_completed', 'no_damage_or_issues', 'photos_uploaded'],
          maintenance:   ['issue_inspected', 'repair_attempted_or_completed', 'photos_uploaded', 'follow_up_needed'],
          laundry:       ['items_collected_or_delivered', 'issue_reported_if_any'],
          transfers:     ['guest_picked_up_or_dropped_off', 'delay_reported_if_any'],
          experiences:   ['guest_attended', 'issue_reported_if_any'],
          guest_request: ['request_fulfilled', 'issue_reported_if_any'],
          other:         ['work_completed', 'issue_reported_if_any']
        };

        // ── Load timeline, evidence checks, photos, and conversation in parallel
        var [ timelineRes, checksRes, photosRes, convRes ] = await Promise.all([
          sb.from('timeline_events')
            .select('id, event_type, event_title, event_description, created_at')
            .eq('task_id', taskId)
            .order('created_at', { ascending: false }),
          sb.from('task_evidence_checks')
            .select('id, task_id, check_key, is_checked, note, photo_id, completed_at, completed_by')
            .eq('task_id', taskId)
            .order('check_key', { ascending: true }),
          sb.from('task_photos')
            .select('id, task_id, photo_type, storage_path, caption, created_at')
            .eq('task_id', taskId)
            .order('created_at', { ascending: true }),
          sb.from('operations_conversations')
            .select('id, task_id, property_id, status, created_at')
            .eq('task_id', taskId)
            .maybeSingle()
        ]);

        var timeline = timelineRes.data || [];
        var checks   = checksRes.data   || [];
        var photos   = photosRes.data   || [];
        var conv     = convRes.data     || null;

        var messages = [];
        if (conv) {
          var { data: msgData } = await sb
            .from('operations_messages')
            .select('id, operations_conversation_id, sender_type, message_text, is_read, created_at')
            .eq('operations_conversation_id', conv.id)
            .order('created_at', { ascending: true });
          messages = msgData || [];
        }

        // ── Render ─────────────────────────────────────────────────────────
        var propName     = (task.properties && task.properties.display_name) || 'Property';
        var propLocation = task.properties
          ? [task.properties.address_city, task.properties.address_province].filter(Boolean).join(', ')
          : null;
        var typeLabel = TASK_TYPE_LABELS[task.task_type] || task.task_type;
        var valueStr  = fmtValue(task.task_value_amount, task.task_value_currency);

        var PARTNER_SERVICE_LABELS = {
          cleaning:    'Cleaning',
          maintenance: 'Maintenance',
          laundry:     'Laundry',
          transfers:   'Transfers',
          experiences: 'Experiences'
        };

        function partnerInfoHtml() {
          var p = task.assigned_partner;
          if (!p) return infoItem('Assigned to', null, 'Not assigned');

          var name = p.display_name || p.full_name || 'Partner';

          var serviceLabel = null;
          if (Array.isArray(p.partner_service_types) && p.partner_service_types.length) {
            serviceLabel = PARTNER_SERVICE_LABELS[p.partner_service_types[0]] || null;
          }

          var verifiedLabel = (p.is_identity_verified === true) ? 'Verified partner' : null;
          var parts = [serviceLabel, verifiedLabel].filter(Boolean);
          var subLine = parts.length
            ? '<span style="font-size:0.72rem;color:var(--stone,#78716C);margin-top:3px;display:block">' +
                esc(parts.join(' \xb7 ')) +
              '</span>'
            : '';

          return '<div class="td-info-item">' +
            '<span class="td-info-label">Assigned to</span>' +
            '<span class="td-info-value">' + esc(name) + '</span>' +
            subLine +
          '</div>';
        }

        var SENDER_LABEL = {
          homeowner: 'You', partner: 'Partner',
          ai: 'Nauxica', system: 'Nauxica', operator: 'Nauxica'
        };

        function msgRowHtml(m) {
          var sender = SENDER_LABEL[m.sender_type] || 'Nauxica';
          return '<div class="td-msg-row">' +
            '<div class="td-msg-sender">' + esc(sender) + '</div>' +
            '<div class="td-msg-text">' + esc(m.message_text) + '</div>' +
            '<div class="td-msg-time">' + esc(new Date(m.created_at).toLocaleString()) + '</div>' +
          '</div>';
        }

        function renderMessages() {
          var listEl = document.getElementById('tdMsgList');
          if (!listEl) return;
          listEl.innerHTML = messages.length
            ? messages.map(msgRowHtml).join('')
            : '<p class="td-empty">No messages yet. Use this space to contact the partner about this task.</p>';
          listEl.scrollTop = listEl.scrollHeight;
        }

        function setConvError(msg) {
          var el = document.getElementById('tdConvError');
          if (!el) return;
          el.textContent = msg || '';
          el.style.display = msg ? 'block' : 'none';
        }

        window.__tdSendMsg = async function () {
          var input   = document.getElementById('tdMsgInput');
          var sendBtn = document.getElementById('tdMsgSend');
          var text    = input ? input.value.trim() : '';
          if (!text) return;

          if (sendBtn) sendBtn.disabled = true;
          if (input)   input.disabled   = true;
          setConvError('');

          try {
            if (!conv) {
              var { data: newConv, error: convErr } = await sb
                .from('operations_conversations')
                .insert({ task_id: taskId, property_id: task.property_id })
                .select()
                .single();
              if (convErr) {
                setConvError('Could not start the conversation. Please try again.');
                return;
              }
              conv = newConv;
            }

            var { data: newMsg, error: msgErr } = await sb
              .from('operations_messages')
              .insert({
                operations_conversation_id: conv.id,
                sender_type:  'homeowner',
                message_text: text
              })
              .select()
              .single();

            if (msgErr) {
              setConvError('Could not send the message. Please try again.');
              return;
            }

            if (input) input.value = '';
            messages.push(newMsg);
            renderMessages();

            // Best-effort timeline log — fire and forget; no UI depends on it
            window.NauxicaTimeline && window.NauxicaTimeline.log({
              property_id: task.property_id,
              task_id:     taskId,
              actor_type:  'homeowner',
              event_type:  'support_message_sent',
              event_title: 'Homeowner sent a message',
              metadata:    { conversation_id: conv.id }
            });

          } catch (err) {
            console.error('Message send error:', err);
            setConvError('Could not send the message. Please try again.');
          } finally {
            if (sendBtn) sendBtn.disabled = false;
            if (input)   input.disabled   = false;
          }
        };

        function setPhotoViewError(msg) {
          var el = document.getElementById('tdPhotoViewError');
          if (!el) return;
          el.textContent = msg || '';
          el.style.display = msg ? 'block' : 'none';
        }

        window.__openTaskPhoto = async function(storagePath) {
          setPhotoViewError('');
          try {
            var res = await sb.storage.from('task-photos').createSignedUrl(storagePath, 300);
            if (res.error || !res.data || !res.data.signedUrl) {
              setPhotoViewError('Could not open the photo. Please try again.');
              return;
            }
            var opened = window.open(res.data.signedUrl, '_blank', 'noopener,noreferrer');
            if (!opened) {
              setPhotoViewError('Pop-up blocked — please allow pop-ups for this page and try again.');
            }
          } catch (err) {
            console.error('Photo open error:', err);
            setPhotoViewError('Could not open the photo. Please try again.');
          }
        };

        var convBodyHtml = messages.length
          ? messages.map(msgRowHtml).join('')
          : '<p class="td-empty">No messages yet. Use this space to contact the partner about this task.</p>';

        var timelineHtml = timeline.length
          ? timeline.map(function(e) {
              return '<div class="td-timeline-row">' +
                '<div class="td-timeline-title">' + esc(e.event_title) + '</div>' +
                (e.event_description ? '<div class="td-timeline-desc">' + esc(e.event_description) + '</div>' : '') +
                '<div class="td-timeline-time">' + esc(new Date(e.created_at).toLocaleString()) + '</div>' +
              '</div>';
            }).join('')
          : '<p class="td-empty">No timeline events yet.</p>';

        // ── Evidence checks — ordered by task_type key list ──────────────
        // Walk the known key order first, then any unexpected keys at the end.
        var _orderedKeys = EVIDENCE_CHECK_KEYS[task.task_type] || [];
        var _knownKeySet = {};
        _orderedKeys.forEach(function(k) { _knownKeySet[k] = true; });
        var _checksMap = {};
        checks.forEach(function(c) { _checksMap[c.check_key] = c; });
        var orderedChecks = [];
        _orderedKeys.forEach(function(k) {
          if (_checksMap[k]) orderedChecks.push(_checksMap[k]);
        });
        checks.forEach(function(c) {
          if (!_knownKeySet[c.check_key]) orderedChecks.push(c);
        });

        var checksHtml = orderedChecks.length
          ? orderedChecks.map(function(c) {
              var label  = EVIDENCE_CHECK_LABEL[c.check_key] || c.check_key.replace(/_/g, ' ');
              var isDone = !!c.is_checked;
              var statusHtml = isDone
                ? '<span class="td-evidence-done"><i class="fa-solid fa-check" aria-hidden="true"></i> Submitted</span>'
                : '<span class="td-evidence-pending">Not submitted</span>';
              var completedHtml = (isDone && c.completed_at)
                ? '<div class="td-evidence-meta">Submitted ' + esc(new Date(c.completed_at).toLocaleString()) + '</div>'
                : '';
              var noteHtml = c.note
                ? '<div class="td-evidence-note">Partner note: ' + esc(c.note) + '</div>'
                : '';
              var photoHtml = c.photo_id
                ? '<div class="td-evidence-meta"><i class="fa-solid fa-image" aria-hidden="true"></i> Photo attached</div>'
                : '';
              return '<div class="td-evidence-row">' +
                '<div class="td-evidence-label">' + esc(label) + statusHtml + '</div>' +
                completedHtml +
                noteHtml +
                photoHtml +
              '</div>';
            }).join('')
          : '<p class="td-empty">No evidence submitted yet.</p>';

        // ── Reservation context (only when linked) ─────────────────────────
        var reservationHtml = '';
        if (task.reservations) {
          var rv = task.reservations;
          reservationHtml =
            '<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--color-border-tertiary,rgba(29,35,39,0.07))">' +
              '<div style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--stone);margin-bottom:8px">Linked reservation</div>' +
              '<div class="td-info-grid">' +
                infoItem('Guest',     rv.guest_name,    '—') +
                infoItem('Check-in',  rv.checkin_date,  '—') +
                infoItem('Check-out', rv.checkout_date, '—') +
              '</div>' +
            '</div>';
        }

        // ── Photo chips (one per photo, each clickable) ────────────────────
        var photoCountsHtml = '';
        if (!photos.length) {
          photoCountsHtml = '<p class="td-empty">No photos attached yet.</p>';
        } else {
          photoCountsHtml = photos.map(function(p) {
            var label = PHOTO_TYPE_LABEL[p.photo_type] || p.photo_type.replace(/_/g, ' ');
            var chip  = p.caption || p.storage_path.split('/').pop();
            return '<div class="td-photo-row" style="cursor:pointer" ' +
              'data-storage-path="' + esc(p.storage_path) + '" ' +
              'onclick="window.__openTaskPhoto(this.dataset.storagePath)" ' +
              'role="button" aria-label="Open ' + esc(label) + '">' +
              '<span><i class="fa-solid fa-image" aria-hidden="true" ' +
                'style="margin-right:5px;color:var(--etna-orange,#E85D04)"></i>' +
                esc(label) + '</span>' +
              '<span style="font-size:0.78rem;color:var(--stone);' +
                'max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
                esc(chip) + '</span>' +
            '</div>';
          }).join('');
        }

        // ── Task Review (Sprint 030B.2) ─────────────────────────────────
        // Derives reviewed state from timeline — no status write needed.
        var hasReviewed = timeline.some(function(e) {
          return e.event_type === 'homeowner_confirmed_completion';
        });

        function buildReviewHtml() {
          if (task.status !== 'completed') return '';
          if (hasReviewed) {
            return '<div class="dashboard-card td-card" id="tdReviewCard">' +
              '<h3 class="td-card-title">' +
                '<i class="fa-solid fa-circle-check" aria-hidden="true"></i> Task Review' +
              '</h3>' +
              '<div class="td-review-done">' +
                '<i class="fa-solid fa-check" aria-hidden="true"></i> Completion confirmed' +
              '</div>' +
              '<p style="font-size:0.82rem;color:var(--stone,#78716C);margin:0">' +
                'You\'ve reviewed this task. Use the Conversation below if you have further questions.' +
              '</p>' +
            '</div>';
          }
          return '<div class="dashboard-card td-card" id="tdReviewCard">' +
            '<h3 class="td-card-title">' +
              '<i class="fa-solid fa-circle-check" aria-hidden="true"></i> Task Review' +
            '</h3>' +
            '<p style="font-size:0.82rem;color:var(--stone,#78716C);margin:0 0 14px">' +
              'The partner has marked this task complete. Review the evidence and photos above, then take an action below.' +
            '</p>' +
            '<div class="td-review-actions">' +
              '<button type="button" class="td-review-confirm" onclick="window.__tdConfirmCompletion()">' +
                '<i class="fa-solid fa-check" aria-hidden="true"></i> Confirm completion' +
              '</button>' +
              '<button type="button" class="td-review-followup" onclick="window.__tdRequestFollowUp()">' +
                '<i class="fa-solid fa-arrow-rotate-right" aria-hidden="true"></i> Request follow-up' +
              '</button>' +
            '</div>' +
          '</div>';
        }

        function refreshReviewUI() {
          var el = document.getElementById('tdReviewCard');
          if (!el) return;
          el.outerHTML = buildReviewHtml();
        }

        window.__tdConfirmCompletion = function() {
          var btn = document.querySelector('#tdReviewCard .td-review-confirm');
          if (btn) btn.disabled = true;

          // Best-effort timeline log — fire and forget
          window.NauxicaTimeline && window.NauxicaTimeline.log({
            property_id: task.property_id,
            task_id:     taskId,
            actor_type:  'homeowner',
            event_type:  'homeowner_confirmed_completion',
            event_title: 'Homeowner confirmed task completion',
            metadata:    { task_status: task.status }
          });

          hasReviewed = true;
          refreshReviewUI();
        };

        window.__tdRequestFollowUp = function() {
          // Best-effort timeline log — fire and forget
          window.NauxicaTimeline && window.NauxicaTimeline.log({
            property_id: task.property_id,
            task_id:     taskId,
            actor_type:  'homeowner',
            event_type:  'homeowner_requested_follow_up',
            event_title: 'Homeowner requested follow-up',
            metadata:    { task_status: task.status }
          });

          var input = document.getElementById('tdMsgInput');
          if (input) {
            input.value = 'Hi, I’ve reviewed the completed task and would like to request a follow-up on: ';
            input.focus();
            input.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        };

        root.innerHTML =
          // ── Header card ──────────────────────────────────────────────────
          '<div class="dashboard-card td-header-card">' +
            '<div class="td-header-top">' +
              '<div>' +
                '<div class="td-property-name">' + esc(propName) + '</div>' +
                '<div class="td-task-title">' + esc(task.title) + ' &middot; ' + esc(typeLabel) + '</div>' +
              '</div>' +
              '<div class="td-badges">' + statusBadge(task.status) + priorityBadge(task.priority) + '</div>' +
            '</div>' +
            '<div class="td-info-grid">' +
              infoItem('Due date',    task.due_date,                'Not set') +
              infoItem('Task value',  valueStr,                     'Not set') +
              infoItem('Location',    propLocation,                 '—') +
              partnerInfoHtml() +
              '<div class="td-info-item" style="grid-column:1/-1">' +
                '<span class="td-info-label">Description</span>' +
                (task.description
                  ? '<span class="td-info-value">' + esc(task.description) + '</span>'
                  : '<span class="td-info-value td-info-muted">No description provided.</span>') +
              '</div>' +
            '</div>' +
          reservationHtml +
          '</div>' +

          // ── Evidence & Photos card ───────────────────────────────────────
          '<div class="dashboard-card td-card">' +
            '<h3 class="td-card-title">' +
              '<i class="fa-solid fa-clipboard-check" aria-hidden="true"></i>' +
              ' Evidence &amp; Photos' +
            '</h3>' +
            checksHtml +
            '<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--color-border-tertiary,rgba(29,35,39,0.07))">' +
              '<div style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--stone);margin-bottom:8px">Photos</div>' +
              photoCountsHtml +
              '<div id="tdPhotoViewError" class="td-conv-error" style="display:none"></div>' +
            '</div>' +
          '</div>' +

          // ── Task Review card (completed tasks only) ────────────────────────
          buildReviewHtml() +

          // ── Conversation card ────────────────────────────────────────────
          '<div class="dashboard-card td-card">' +
            '<h3 class="td-card-title">' +
              '<i class="fa-solid fa-comments" aria-hidden="true"></i>' +
              ' Conversation' +
            '</h3>' +
            '<p style="font-size:0.82rem;color:var(--stone,#78716C);margin:0 0 10px">Use this conversation to coordinate directly with the assigned partner about this task.</p>' +
            '<div class="td-msg-list" id="tdMsgList">' + convBodyHtml + '</div>' +
            '<div class="td-conv-error" id="tdConvError" style="display:none"></div>' +
            '<div class="td-msg-compose">' +
              '<textarea id="tdMsgInput" class="td-msg-input" rows="2" ' +
                'placeholder="Message the partner about this task…" ' +
                'onkeydown="if(event.ctrlKey&&event.key===\'Enter\')window.__tdSendMsg()"' +
              '></textarea>' +
              '<button type="button" id="tdMsgSend" class="td-msg-send" onclick="window.__tdSendMsg()">Send</button>' +
            '</div>' +
          '</div>' +

          // ── Timeline card ─────────────────────────────────────────────────
          '<div class="dashboard-card td-card">' +
            '<h3 class="td-card-title">' +
              '<i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i>' +
              ' Timeline (' + timeline.length + ')' +
            '</h3>' +
            timelineHtml +
          '</div>';
      })();
    </script>

  </body>
</html>
