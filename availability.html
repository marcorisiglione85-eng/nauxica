<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Availability — Nauxica</title>
    <link rel="icon" href="assets/logo/favicon.ico" />
    <link rel="stylesheet" href="style.css?v=9999" />
  </head>
  <body class="homeowner-dashboard-page">
    <header class="nx-header app-top-header">
      <nav class="nx-nav">
        <a href="index.html" class="site-logo" aria-label="Nauxica home">
          <img src="assets/logo/nauxica-logo-horizontal.svg" alt="Nauxica" />
        </a>
        <button class="mobile-menu-toggle" type="button" aria-label="Open menu">
          <span></span><span></span><span></span>
        </button>
        <ul class="nx-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="contacts.html">Contact</a></li>
          <li>
            <button class="btn app-logout-btn" type="button" id="logout-button">Logout</button>
          </li>
        </ul>
      </nav>
    </header>

    <main class="dashboard-shell homeowner-dashboard">
      <aside class="dashboard-sidebar" role="navigation" aria-label="Dashboard navigation">
        <div class="dashboard-sidebar-inner">
          <div class="sidebar-brand">Nauxica</div>
          <nav class="dashboard-nav"></nav>
        </div>
      </aside>

      <section class="dashboard-main">
        <div class="dashboard-topbar">
          <div class="topbar-left">
            <div class="eyebrow-label" id="workspace-label">Nauxica homeowner workspace</div>
            <h1 class="dashboard-title">Availability</h1>
            <div class="topbar-sub" id="availability-sub">View and manage availability for your properties</div>
          </div>
          <div class="topbar-right">
            <div class="topbar-search">
              <input type="search" placeholder="Search availability, dates" id="globalSearch" />
            </div>
            <div class="topbar-controls">
              <button class="icon-btn" aria-label="Notifications">🔔</button>
              <button class="icon-btn" aria-label="Help">⌘</button>
              <div class="date-chip" id="date-chip">Today</div>
              <div class="profile-chip">
                <div class="avatar" id="profile-avatar">MR</div>
                <div class="profile-meta">
                  <strong id="profile-name">Marco</strong>
                  <span id="profile-role">Homeowner</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <section class="dashboard-grid">
          <div class="col-left">
            <div class="dashboard-card">
              <div class="card-heading-row">
                <div>
                  <h2 class="dashboard-section-title" id="avail-card-title">Availability</h2>
                  <p class="dashboard-card-text" id="avail-card-sub">Loading...</p>
                </div>
              </div>
              <div id="avail-content"></div>
            </div>
          </div>
          <div class="col-right">
            <div class="dashboard-card">
              <h3 class="dashboard-section-title">Summary</h3>
              <div id="avail-summary" class="dashboard-card-text">Loading...</div>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script src="nauxica-demo-data.js"></script>
    <script src="nauxica-shared.js"></script>
    <script type="module" src="supabase-client.js"></script>
    <script>
      (function () {
        const accountType = NauxicaShared.resolveAccountType();
        NauxicaShared.renderNav(document.querySelector('.dashboard-nav'), accountType);
        NauxicaShared.setActivePage('availability');
        NauxicaShared.updateTopbar(accountType);

        const chip = document.getElementById('date-chip');
        if (chip) chip.textContent = NauxicaShared.formatDateChip();

        document.getElementById('logout-button')
          ?.addEventListener('click', NauxicaShared.handleLogout);

        document.getElementById('availability-sub').textContent = accountType === 'partner'
          ? 'Set and manage your service availability windows'
          : 'View and manage availability for your properties';

        if (accountType !== 'partner') return; // homeowner path handled by module script below

        const partnerSchedule = [
          { day: 'Monday',    morning: true,  afternoon: true,  evening: false },
          { day: 'Tuesday',   morning: true,  afternoon: true,  evening: false },
          { day: 'Wednesday', morning: true,  afternoon: false, evening: false },
          { day: 'Thursday',  morning: true,  afternoon: true,  evening: true  },
          { day: 'Friday',    morning: true,  afternoon: true,  evening: false },
          { day: 'Saturday',  morning: false, afternoon: true,  evening: false },
          { day: 'Sunday',    morning: false, afternoon: false, evening: false }
        ];

        const availContent   = document.getElementById('avail-content');
        const availSummary   = document.getElementById('avail-summary');
        const availCardTitle = document.getElementById('avail-card-title');
        const availCardSub   = document.getElementById('avail-card-sub');

        availCardTitle.textContent = 'Weekly Schedule';
        availCardSub.textContent   = 'Your current service availability';

        const activeDays = partnerSchedule.filter(function (d) {
          return d.morning || d.afternoon || d.evening;
        }).length;

        availContent.innerHTML =
          '<div class="messages-list">' +
          partnerSchedule.map(function (d) {
            const slots = [];
            if (d.morning)   slots.push('Morning');
            if (d.afternoon) slots.push('Afternoon');
            if (d.evening)   slots.push('Evening');
            const available = slots.length > 0;
            return '<article class="message-row' + (available ? '' : ' is-read') + '">' +
              '<div class="message-row-main">' +
              '<div class="message-meta-row">' +
              (slots.length > 0
                ? slots.map(function (s) { return '<span class="message-type-pill">' + s + '</span>'; }).join('')
                : '<span class="message-type-pill">Off</span>') +
              '</div>' +
              '<h3>' + d.day + '</h3>' +
              '</div>' +
              '<div class="message-actions">' +
              '<span class="read-label">' + (available ? 'Available' : 'Unavailable') + '</span>' +
              '</div>' +
              '</article>';
          }).join('') +
          '</div>';

        availSummary.innerHTML =
          '<strong>' + activeDays + '</strong> active days this week<br>' +
          '<span>Service: Cleaning · Zone: Taormina area</span>';
      })();
    </script>

    <script type="module">
      (async () => {
        if (NauxicaShared.resolveAccountType() === 'partner') return;

        const { data: sessData } = await window.NauxicaSupabase.auth.getSession();
        if (!sessData || !sessData.session) {
          window.location.replace('login.html');
          throw 0;
        }

        const availContent   = document.getElementById('avail-content');
        const availSummary   = document.getElementById('avail-summary');
        const availCardTitle = document.getElementById('avail-card-title');
        const availCardSub   = document.getElementById('avail-card-sub');

        function esc(s) {
          if (!s) return '';
          return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function addDays(dateStr, n) {
          const d = new Date(dateStr + 'T00:00:00');
          d.setDate(d.getDate() + n);
          return d.toISOString().split('T')[0];
        }

        function fmtDate(dateStr) {
          return new Date(dateStr + 'T00:00:00')
            .toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function fmtDateShort(dateStr) {
          return new Date(dateStr + 'T00:00:00')
            .toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
        }

        function fmtRange(start, end) {
          return (start.substring(0, 4) === end.substring(0, 4)
            ? fmtDateShort(start)
            : fmtDate(start)) + ' – ' + fmtDate(end);
        }

        // Build availability windows by merging blocking reservations into [rangeStart, rangeEnd].
        // Reservations are sorted by checkin_date and already filtered to overlap the range.
        function generateWindows(reservations, rangeStart, rangeEnd) {
          const windows = [];
          let cursor = rangeStart;

          for (const r of reservations) {
            const ci = r.checkin_date < rangeStart ? rangeStart : r.checkin_date;
            // checkout_date is exclusive — guest leaves on that day, so last blocked night = checkout - 1
            const coRaw    = r.checkout_date > addDays(rangeEnd, 1) ? addDays(rangeEnd, 1) : r.checkout_date;
            const blockEnd = addDays(coRaw, -1);

            if (ci > cursor) {
              windows.push({ start: cursor, end: addDays(ci, -1), status: 'Available', reason: '' });
            }
            windows.push({ start: ci, end: blockEnd, status: 'Blocked', reason: r.guest_name || '' });
            cursor = coRaw;
          }

          if (cursor <= rangeEnd) {
            windows.push({ start: cursor, end: rangeEnd, status: 'Available', reason: '' });
          }

          return windows;
        }

        availCardTitle.textContent = 'Property Availability';
        availCardSub.textContent   = 'Loading properties…';
        availContent.innerHTML     = '';
        availSummary.textContent   = 'Loading…';

        const { data: props, error: propsErr } = await window.NauxicaSupabase
          .from('properties')
          .select('id, display_name')
          .order('display_name', { ascending: true });

        if (propsErr || !props || !props.length) {
          availCardSub.textContent = 'No properties found';
          availContent.innerHTML   = '<div class="empty-state-card"><h3>No properties yet</h3>' +
            '<p>Add a property to manage its availability.</p></div>';
          availSummary.textContent = 'No properties managed';
          return;
        }

        const propWord = props.length === 1 ? 'property' : 'properties';
        availCardSub.textContent = props.length + ' ' + propWord + ' · Select one to view availability';

        const today   = new Date().toISOString().split('T')[0];
        const endDate = addDays(today, 89); // ~3 months forward

        let selectedPropId = props[0].id;

        async function loadAndRender() {
          const tabsHtml =
            '<div class="message-filters">' +
            props.map(function (p) {
              return '<button class="message-filter' + (p.id === selectedPropId ? ' active' : '') +
                '" data-prop-id="' + esc(p.id) + '">' + esc(p.display_name || 'Property') + '</button>';
            }).join('') +
            '</div>';

          availContent.innerHTML = tabsHtml +
            '<div id="avail-windows-list"><p style="color:var(--stone);font-size:0.85rem;padding:8px 0">Loading…</p></div>';

          availContent.querySelector('.message-filters').addEventListener('click', function (e) {
            const btn = e.target.closest('[data-prop-id]');
            if (!btn) return;
            selectedPropId = btn.dataset.propId;
            loadAndRender();
          });

          const windowsList = document.getElementById('avail-windows-list');

          const { data: reservations, error: resErr } = await window.NauxicaSupabase
            .from('reservations')
            .select('id, guest_name, checkin_date, checkout_date')
            .eq('property_id', selectedPropId)
            .in('reservation_status', ['confirmed', 'pre_arrival', 'checked_in'])
            .lte('checkin_date', endDate)
            .gt('checkout_date', today)
            .order('checkin_date', { ascending: true });

          if (resErr) {
            windowsList.innerHTML = '<div class="empty-state-card"><p>Failed to load reservations.</p></div>';
            availSummary.textContent = 'Error loading data';
            return;
          }

          const res     = reservations || [];
          const windows = generateWindows(res, today, endDate);

          windowsList.innerHTML =
            '<div class="messages-list">' +
            windows.map(function (w) {
              return '<article class="message-row' + (w.status === 'Blocked' ? '' : ' is-read') + '">' +
                '<div class="message-row-main">' +
                '<div class="message-meta-row">' +
                '<span class="message-type-pill">' + w.status + '</span>' +
                '<span class="message-date">' + esc(fmtRange(w.start, w.end)) + '</span>' +
                '</div>' +
                (w.reason ? '<p>' + esc(w.reason) + '</p>' : '') +
                '</div>' +
                '</article>';
            }).join('') +
            '</div>' +
            '<p style="margin-top:12px;font-size:0.78rem;color:var(--stone)">' +
            'Availability is calculated from confirmed and active reservations.</p>';

          const nextRes      = res[0]; // already sorted ascending
          const blockedCount = res.length;
          availSummary.innerHTML =
            '<strong>' + blockedCount + '</strong> active reservation' + (blockedCount !== 1 ? 's' : '') + '<br>' +
            (nextRes
              ? '<span>Next check-in: ' + esc(fmtDate(nextRes.checkin_date)) + ' · ' + esc(nextRes.guest_name || 'Guest') + '</span>'
              : '<span>No upcoming reservations</span>');
        }

        await loadAndRender();
      })();
    </script>
  </body>
</html>
