<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Availability — Nauxica</title>
    <link rel="icon" href="assets/logo/favicon.ico" />
    <link rel="stylesheet" href="style.css?v=9999" />
  </head>
  <body class="homeowner-dashboard-page">
    <header class="nx-header app-top-header">
      <nav class="nx-nav">
        <a href="index.html" class="site-logo" aria-label="Nauxica home">
          <img src="assets/logo/nauxica-logo-horizontal.svg" alt="Nauxica" />
        </a>
        <button class="mobile-menu-toggle" type="button" aria-label="Open menu">
          <span></span><span></span><span></span>
        </button>
        <ul class="nx-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="contacts.html">Contact</a></li>
          <li>
            <button class="btn app-logout-btn" type="button" id="logout-button">Logout</button>
          </li>
        </ul>
      </nav>
    </header>

    <main class="dashboard-shell homeowner-dashboard">
      <aside class="dashboard-sidebar" role="navigation" aria-label="Dashboard navigation">
        <div class="dashboard-sidebar-inner">
          <div class="sidebar-brand">Nauxica</div>
          <nav class="dashboard-nav"></nav>
        </div>
      </aside>

      <section class="dashboard-main">
        <div class="dashboard-topbar">
          <div class="topbar-left">
            <div class="eyebrow-label" id="workspace-label">Nauxica homeowner workspace</div>
            <h1 class="dashboard-title">Availability</h1>
            <div class="topbar-sub" id="availability-sub">View and manage availability for your properties</div>
          </div>
          <div class="topbar-right">
            <div class="topbar-search">
              <input type="search" placeholder="Search availability, dates" id="globalSearch" />
            </div>
            <div class="topbar-controls">
              <button class="icon-btn" aria-label="Notifications">🔔</button>
              <button class="icon-btn" aria-label="Help">⌘</button>
              <div class="date-chip" id="date-chip">Today</div>
              <div class="profile-chip">
                <div class="avatar" id="profile-avatar">MR</div>
                <div class="profile-meta">
                  <strong id="profile-name">Marco</strong>
                  <span id="profile-role">Homeowner</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <section class="dashboard-grid">
          <div class="col-left">
            <div class="dashboard-card">
              <div class="card-heading-row">
                <div>
                  <h2 class="dashboard-section-title" id="avail-card-title">Availability</h2>
                  <p class="dashboard-card-text" id="avail-card-sub">Loading...</p>
                </div>
              </div>
              <div id="avail-content"></div>
            </div>
          </div>
          <div class="col-right">
            <div class="dashboard-card">
              <h3 class="dashboard-section-title">Summary</h3>
              <div id="avail-summary" class="dashboard-card-text">Loading...</div>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script src="nauxica-demo-data.js"></script>
    <script src="nauxica-shared.js"></script>
    <script>
      (function () {
        const accountType = NauxicaShared.resolveAccountType();
        NauxicaShared.renderNav(document.querySelector('.dashboard-nav'), accountType);
        NauxicaShared.setActivePage('availability');
        NauxicaShared.updateTopbar(accountType);

        const chip = document.getElementById('date-chip');
        if (chip) chip.textContent = NauxicaShared.formatDateChip();

        document.getElementById('logout-button')
          ?.addEventListener('click', NauxicaShared.handleLogout);

        document.getElementById('availability-sub').textContent = accountType === 'partner'
          ? 'Set and manage your service availability windows'
          : 'View and manage availability for your properties';

        const availContent = document.getElementById('avail-content');
        const availSummary = document.getElementById('avail-summary');
        const availCardTitle = document.getElementById('avail-card-title');
        const availCardSub = document.getElementById('avail-card-sub');

        // Demo availability windows per property index (homeowner)
        const homeownerDemoWindows = [
          [
            { range: '28 May – 3 Jun 2026', status: 'Blocked', reason: 'Owner use' },
            { range: '4 Jun – 14 Jun 2026', status: 'Available', reason: '' },
            { range: '15 Jun – 20 Jun 2026', status: 'Blocked', reason: 'Maintenance' },
            { range: '21 Jun – 31 Aug 2026', status: 'Available', reason: '' }
          ],
          [
            { range: '28 May – 7 Jun 2026', status: 'Available', reason: '' },
            { range: '8 Jun – 14 Jun 2026', status: 'Blocked', reason: 'Guest reservation' },
            { range: '15 Jun – 31 Aug 2026', status: 'Available', reason: '' }
          ],
          [
            { range: '28 May – 10 Jun 2026', status: 'Blocked', reason: 'Deep clean & refresh' },
            { range: '11 Jun – 31 Aug 2026', status: 'Available', reason: '' }
          ]
        ];

        // Demo weekly schedule (partner)
        const partnerSchedule = [
          { day: 'Monday',    morning: true,  afternoon: true,  evening: false },
          { day: 'Tuesday',   morning: true,  afternoon: true,  evening: false },
          { day: 'Wednesday', morning: true,  afternoon: false, evening: false },
          { day: 'Thursday',  morning: true,  afternoon: true,  evening: true  },
          { day: 'Friday',    morning: true,  afternoon: true,  evening: false },
          { day: 'Saturday',  morning: false, afternoon: true,  evening: false },
          { day: 'Sunday',    morning: false, afternoon: false, evening: false }
        ];

        function renderHomeownerAvailability() {
          const state = window.NauxicaDemoData.loadState();
          const properties = state.properties || [];

          availCardTitle.textContent = 'Property Availability';

          if (!properties.length) {
            availCardSub.textContent = 'No properties found';
            availContent.innerHTML = '<div class="empty-state-card"><h3>No properties yet</h3><p>Add a property to manage its availability.</p></div>';
            availSummary.textContent = 'No properties managed';
            return;
          }

          const propWord = properties.length === 1 ? 'property' : 'properties';
          availCardSub.textContent = properties.length + ' ' + propWord + ' · Select one to view windows';
          availSummary.innerHTML = '<strong>' + properties.length + '</strong> ' + propWord + ' managed<br><span>Next opening: 4 Jun 2026</span>';

          let selectedIndex = 0;

          function renderPropertyContent() {
            const windows = homeownerDemoWindows[Math.min(selectedIndex, homeownerDemoWindows.length - 1)];
            availContent.innerHTML =
              '<div class="message-filters">' +
              properties.map(function (p, i) {
                return '<button class="message-filter' + (i === selectedIndex ? ' active' : '') + '" data-prop-index="' + i + '">' +
                  (p.name || p.title || 'Property ' + (i + 1)) + '</button>';
              }).join('') +
              '</div>' +
              '<div class="messages-list">' +
              windows.map(function (w) {
                return '<article class="message-row">' +
                  '<div class="message-row-main">' +
                  '<div class="message-meta-row">' +
                  '<span class="message-type-pill">' + w.status + '</span>' +
                  '<span class="message-date">' + w.range + '</span>' +
                  '</div>' +
                  (w.reason ? '<p>' + w.reason + '</p>' : '') +
                  '</div>' +
                  '</article>';
              }).join('') +
              '</div>';
          }

          renderPropertyContent();

          availContent.addEventListener('click', function (e) {
            const btn = e.target.closest('[data-prop-index]');
            if (!btn) return;
            selectedIndex = parseInt(btn.dataset.propIndex, 10);
            renderPropertyContent();
          });
        }

        function renderPartnerAvailability() {
          availCardTitle.textContent = 'Weekly Schedule';
          availCardSub.textContent = 'Your current service availability';

          const activeDays = partnerSchedule.filter(function (d) {
            return d.morning || d.afternoon || d.evening;
          }).length;

          availContent.innerHTML =
            '<div class="messages-list">' +
            partnerSchedule.map(function (d) {
              const slots = [];
              if (d.morning) slots.push('Morning');
              if (d.afternoon) slots.push('Afternoon');
              if (d.evening) slots.push('Evening');
              const available = slots.length > 0;
              return '<article class="message-row' + (available ? '' : ' is-read') + '">' +
                '<div class="message-row-main">' +
                '<div class="message-meta-row">' +
                (slots.length > 0
                  ? slots.map(function (s) { return '<span class="message-type-pill">' + s + '</span>'; }).join('')
                  : '<span class="message-type-pill">Off</span>') +
                '</div>' +
                '<h3>' + d.day + '</h3>' +
                '</div>' +
                '<div class="message-actions">' +
                '<span class="read-label">' + (available ? 'Available' : 'Unavailable') + '</span>' +
                '</div>' +
                '</article>';
            }).join('') +
            '</div>';

          availSummary.innerHTML =
            '<strong>' + activeDays + '</strong> active days this week<br>' +
            '<span>Service: Cleaning · Zone: Taormina area</span>';
        }

        if (accountType === 'partner') {
          renderPartnerAvailability();
        } else {
          renderHomeownerAvailability();
        }
      })();
    </script>
  </body>
</html>
