<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tasks — Nauxica</title>
    <link rel="icon" href="assets/logo/favicon.ico" />
    <link rel="stylesheet" href="style.css?v=9999" />
  </head>
  <body class="homeowner-dashboard-page">
    <header class="nx-header app-top-header">
      <nav class="nx-nav">
        <a href="index.html" class="site-logo" aria-label="Nauxica home">
          <img src="assets/logo/nauxica-logo-horizontal.svg" alt="Nauxica" />
        </a>
        <button class="mobile-menu-toggle" type="button" aria-label="Open menu">
          <span></span><span></span><span></span>
        </button>
        <ul class="nx-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="contacts.html">Contact</a></li>
          <li>
            <button class="btn app-logout-btn" type="button" id="logout-button">Logout</button>
          </li>
        </ul>
      </nav>
    </header>

    <main class="dashboard-shell homeowner-dashboard">
      <aside class="dashboard-sidebar" role="navigation" aria-label="Dashboard navigation">
        <div class="dashboard-sidebar-inner">
          <div class="sidebar-brand">Nauxica</div>
          <nav class="dashboard-nav"></nav>
        </div>
      </aside>

      <section class="dashboard-main">
        <div class="dashboard-topbar">
          <div class="topbar-left">
            <div class="eyebrow-label" id="workspace-label">Nauxica homeowner workspace</div>
            <h1 class="dashboard-title">Tasks</h1>
            <div class="topbar-sub" id="tasks-summary">Open tasks and to-dos across your properties</div>
          </div>
          <div class="topbar-right">
            <div class="topbar-search">
              <input type="search" placeholder="Search tasks, properties, types" id="globalSearch" />
            </div>
            <div class="topbar-controls">
              <button class="icon-btn" aria-label="Notifications">🔔</button>
              <button class="icon-btn" aria-label="Help">⌘</button>
              <div class="date-chip" id="date-chip">Today</div>
              <div class="profile-chip">
                <div class="avatar" id="profile-avatar">MR</div>
                <div class="profile-meta">
                  <strong id="profile-name">Marco</strong>
                  <span id="profile-role">Homeowner</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <section class="dashboard-grid">
          <div class="col-left">
            <div class="dashboard-card">
              <div class="card-heading-row">
                <div>
                  <h2 class="dashboard-section-title">Task list</h2>
                  <p class="dashboard-card-text">Track and manage tasks for your properties</p>
                </div>
              </div>
              <div class="message-filters" id="taskFilters" style="margin:10px 0 14px">
                <button class="message-filter active" data-filter="all" type="button">All</button>
                <button class="message-filter" data-filter="open" type="button">Open</button>
                <button class="message-filter" data-filter="assigned" type="button">Assigned</button>
                <button class="message-filter" data-filter="in_progress" type="button">In progress</button>
                <button class="message-filter" data-filter="completed" type="button">Completed</button>
                <button class="message-filter" data-filter="cancelled" type="button">Cancelled</button>
              </div>
              <div class="dynamic-task-list" id="tasksList"></div>
            </div>
          </div>
          <div class="col-right">
            <div class="dashboard-card" id="tasksSummaryCard">
              <h3 class="dashboard-section-title">Summary</h3>
              <div id="taskStatsPanel" class="dashboard-card-text">Loading...</div>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script src="nauxica-demo-data.js"></script>
    <script src="nauxica-shared.js"></script>
    <script type="module" src="supabase-client.js"></script>
    <script src="nauxica-timeline.js"></script>
    <script>
      (function () {
        var accountType = NauxicaShared.resolveAccountType();
        NauxicaShared.renderNav(document.querySelector('.dashboard-nav'), accountType);
        NauxicaShared.setActivePage('tasks');
        NauxicaShared.updateTopbar(accountType);
        var chip = document.getElementById('date-chip');
        if (chip) chip.textContent = NauxicaShared.formatDateChip();
        document.getElementById('logout-button')
          ?.addEventListener('click', NauxicaShared.handleLogout);
      })();
    </script>
    <script type="module">
      (async () => {
        var sb = window.NauxicaSupabase;
        var { data: sessData } = await sb.auth.getSession();
        if (!sessData.session) { window.location.replace('login.html'); throw 0; }

        var allTasks = [];
        var currentFilter = 'all';

        function esc(s) {
          if (!s) return '';
          return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        var TASK_TYPE_LABELS = {
          cleaning: 'Cleaning', maintenance: 'Maintenance', inspection: 'Inspection',
          laundry: 'Laundry', guest_request: 'Guest request', other: 'Other'
        };

        var STATUS_LABELS = {
          open: 'Open', assigned: 'Assigned', in_progress: 'In progress',
          completed: 'Completed', cancelled: 'Cancelled'
        };

        function fmtValue(amount, currency) {
          if (amount == null) return null;
          var sym = currency === 'EUR' ? '€' : currency === 'USD' ? '$' : currency === 'GBP' ? '£' : (currency || 'EUR') + ' ';
          return sym + parseFloat(amount).toFixed(2);
        }

        function priorityClass(priority) {
          if (priority === 'urgent') return 'task-red';
          if (priority === 'high')   return 'task-yellow';
          return 'task-green';
        }

        async function loadTasks() {
          var { data, error } = await sb
            .from('tasks')
            .select('id, property_id, title, task_type, priority, status, due_date, created_at, task_value_amount, task_value_currency, properties(display_name, property_code), reservation_id, reservations(guest_name, checkin_date, checkout_date)')
            .order('created_at', { ascending: false });
          if (error) { console.error('Tasks load error:', error); return []; }
          return data || [];
        }

        function renderList(tasks) {
          var filtered = currentFilter === 'all'
            ? tasks : tasks.filter(function(t) { return t.status === currentFilter; });
          var el = document.getElementById('tasksList');
          if (!el) return;
          if (!filtered.length) {
            var msg = tasks.length === 0
              ? 'No tasks yet. Create your first task from the dashboard.'
              : 'No ' + currentFilter.replace('_', ' ') + ' tasks.';
            el.innerHTML = '<div class="empty-state-card"><p>' + esc(msg) + '</p></div>';
            return;
          }
          el.innerHTML = filtered.map(function(t) {
            var propName   = (t.properties && t.properties.display_name) || 'Property';
            var typeLabel  = TASK_TYPE_LABELS[t.task_type] || t.task_type;
            var cls        = priorityClass(t.priority);
            var due        = t.due_date ? 'Due ' + t.due_date : '';
            var valueStr   = fmtValue(t.task_value_amount, t.task_value_currency);
            var isAiTask   = t.title && t.title.startsWith('[Nauxica Concierge]');
            var dispTitle  = isAiTask ? t.title.replace('[Nauxica Concierge] ', '') : t.title;
            var aiBadge    = isAiTask ? '<span style="display:inline-block;font-size:0.63rem;font-weight:800;padding:2px 7px;border-radius:999px;background:rgba(99,102,241,0.12);color:#4338ca;margin-left:6px;vertical-align:middle;white-space:nowrap">Nauxica Concierge</span>' : '';
            var valueLine  = valueStr
              ? '<small style="color:var(--stone)">Value: ' + esc(valueStr) + '</small>'
              : '';
            var guestLine  = (t.reservations && t.reservations.guest_name)
              ? '<small style="color:var(--stone)">Guest: ' + esc(t.reservations.guest_name) + '</small>'
              : '';
            var assignLink = t.status === 'open'
              ? '<a href="operations.html?task=' + esc(t.id) + '" ' +
                'style="font-size:0.75rem;color:#2563eb;text-decoration:none;display:inline-block;margin-top:4px">' +
                'Assign partner →</a>'
              : '';
            var statusOpts = Object.keys(STATUS_LABELS).map(function(val) {
              return '<option value="' + val + '"' + (t.status === val ? ' selected' : '') + '>' + STATUS_LABELS[val] + '</option>';
            }).join('');
            return '<div class="priority-task ' + esc(cls) + '">' +
              '<div class="task-main">' +
                '<span class="task-dot"></span>' +
                '<div>' +
                  '<strong>' + esc(dispTitle) + '</strong>' + aiBadge +
                  '<p>' + esc(propName) + ' \xb7 ' + esc(typeLabel) + ' \xb7 ' + esc(t.priority) + ' priority</p>' +
                  (due ? '<small>' + esc(due) + '</small>' : '') +
                  guestLine +
                  valueLine +
                  assignLink +
                '</div>' +
              '</div>' +
              '<select class="task-status-select" data-task-id="' + esc(t.id) + '" ' +
                'style="font-size:0.8rem;padding:4px 8px;border-radius:8px;border:1px solid rgba(0,0,0,0.12);background:#fff;cursor:pointer">' +
                statusOpts +
              '</select>' +
            '</div>';
          }).join('');
        }

        function renderStats(tasks) {
          var open   = tasks.filter(function(t) { return t.status === 'open'; }).length;
          var inProg = tasks.filter(function(t) { return t.status === 'in_progress' || t.status === 'assigned'; }).length;
          var urgent = tasks.filter(function(t) { return t.priority === 'urgent'; }).length;
          var sub = document.getElementById('tasks-summary');
          if (sub) sub.textContent = tasks.length + ' task' + (tasks.length !== 1 ? 's' : '') + ' across your properties';
          var statsEl = document.getElementById('taskStatsPanel');
          if (statsEl) {
            statsEl.innerHTML =
              '<strong>' + open + '</strong> open &nbsp; ' +
              '<span style="color:var(--stone)">' + inProg + ' in progress &nbsp;&middot;&nbsp; ' + urgent + ' urgent</span>';
          }
        }

        document.getElementById('tasksList').addEventListener('change', async function(e) {
          var sel = e.target;
          if (!sel.classList.contains('task-status-select')) return;
          var taskId    = sel.dataset.taskId;
          var newStatus = sel.value;
          var cancelTask = allTasks.find(function(t) { return t.id === taskId; });
          var { error } = await sb.from('tasks').update({ status: newStatus }).eq('id', taskId);
          if (error) {
            console.error('Status update error:', error);
            allTasks = await loadTasks();
          } else {
            allTasks = allTasks.map(function(t) {
              return t.id === taskId ? Object.assign({}, t, { status: newStatus }) : t;
            });
            if (newStatus === 'cancelled') {
              window.NauxicaTimeline.log({
                property_id: cancelTask ? cancelTask.property_id : null,
                task_id:     taskId,
                actor_type:  'homeowner',
                event_type:  'task_cancelled',
                event_title: 'Task cancelled' + (cancelTask ? ': ' + cancelTask.title : ''),
                metadata:    { task_value_amount: cancelTask ? cancelTask.task_value_amount : null, task_value_currency: cancelTask ? cancelTask.task_value_currency : 'EUR' }
              });
            }
          }
          renderList(allTasks);
          renderStats(allTasks);
        });

        document.querySelectorAll('#taskFilters .message-filter').forEach(function(btn) {
          btn.addEventListener('click', function() {
            currentFilter = btn.dataset.filter;
            document.querySelectorAll('#taskFilters .message-filter').forEach(function(b) {
              b.classList.toggle('active', b === btn);
            });
            renderList(allTasks);
          });
        });

        allTasks = await loadTasks();
        renderList(allTasks);
        renderStats(allTasks);
      })();
    </script>
  </body>
</html>
