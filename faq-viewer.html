<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAQ — Nauxica</title>
  <link rel="icon" href="assets/logo/favicon.ico" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── Hero ──────────────────────────────────────────────────────── */
    .faq-hero {
      background: var(--charcoal);
      padding: 72px 20px 56px;
      text-align: center;
    }

    .faq-hero-inner {
      width: min(780px, 100%);
      margin: 0 auto;
    }

    .faq-breadcrumb {
      font-size: 0.82rem;
      font-weight: 700;
      color: rgba(255,255,255,0.5);
      margin-bottom: 16px;
      letter-spacing: 0.03em;
    }

    .faq-breadcrumb a {
      color: rgba(255,255,255,0.65);
      text-decoration: none;
      transition: color .15s;
    }

    .faq-breadcrumb a:hover { color: var(--terracotta); }

    .faq-breadcrumb-sep { margin: 0 8px; }

    .faq-hero h1 {
      font-family: "Bodoni 72", Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      color: #fff;
      margin: 0 0 14px;
      line-height: 1.1;
    }

    .faq-hero-sub {
      font-size: 1rem;
      color: rgba(255,255,255,0.62);
      max-width: 540px;
      margin: 0 auto;
      line-height: 1.55;
    }

    /* ── Type switcher pills ─────────────────────────────────────── */
    .faq-type-bar {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 28px;
    }

    .faq-type-pill {
      display: inline-block;
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 800;
      text-decoration: none;
      border: 1.5px solid rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.65);
      transition: background .15s, color .15s, border-color .15s;
    }

    .faq-type-pill:hover {
      background: rgba(255,255,255,0.08);
      color: #fff;
      border-color: rgba(255,255,255,0.35);
    }

    .faq-type-pill.active {
      background: var(--terracotta);
      color: #fff;
      border-color: var(--terracotta);
    }

    /* ── Content wrapper ─────────────────────────────────────────── */
    .faq-body {
      background: #f7f5f1;
      padding: 56px 20px 80px;
    }

    .faq-wrap {
      width: min(780px, 100%);
      margin: 0 auto;
    }

    .faq-intro-text {
      font-size: 0.96rem;
      color: var(--stone);
      line-height: 1.6;
      margin-bottom: 40px;
    }

    /* ── Section ─────────────────────────────────────────────────── */
    .faq-section {
      margin-bottom: 44px;
    }

    .faq-section-heading {
      font-family: "Bodoni 72", Georgia, "Times New Roman", serif;
      font-size: 1.45rem;
      color: var(--charcoal);
      margin: 0 0 14px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--terracotta);
    }

    /* ── Accordion item ──────────────────────────────────────────── */
    .faq-item {
      background: #fff;
      border: 1px solid rgba(15,23,42,0.08);
      border-radius: 12px;
      margin-bottom: 6px;
      overflow: hidden;
      transition: box-shadow .15s;
    }

    .faq-item:hover {
      box-shadow: 0 2px 12px rgba(15,23,42,0.07);
    }

    .faq-item[open] {
      box-shadow: 0 2px 16px rgba(15,23,42,0.10);
    }

    .faq-question {
      padding: 16px 20px;
      font-size: 0.93rem;
      font-weight: 800;
      color: var(--charcoal);
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      user-select: none;
      transition: background .12s;
    }

    .faq-question::-webkit-details-marker { display: none; }

    .faq-question::after {
      content: '+';
      color: var(--terracotta);
      font-size: 1.35rem;
      font-weight: 400;
      line-height: 1;
      flex-shrink: 0;
      transition: transform .2s, color .15s;
    }

    .faq-item[open] > .faq-question {
      background: rgba(197,104,61,0.04);
      color: var(--terracotta);
    }

    .faq-item[open] > .faq-question::after {
      transform: rotate(45deg);
    }

    .faq-answer {
      padding: 0 20px 18px 20px;
      border-top: 1px solid rgba(15,23,42,0.06);
    }

    .faq-answer p {
      margin: 14px 0 0;
      font-size: 0.9rem;
      color: var(--stone);
      line-height: 1.65;
    }

    .faq-answer ul {
      margin: 10px 0 0 0;
      padding-left: 20px;
    }

    .faq-answer li {
      font-size: 0.9rem;
      color: var(--stone);
      line-height: 1.65;
      margin-bottom: 4px;
    }

    /* ── Loading / error states ──────────────────────────────────── */
    .faq-loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--stone);
      font-size: 0.92rem;
    }

    .faq-error {
      background: rgba(192,57,43,0.06);
      border: 1px solid rgba(192,57,43,0.18);
      border-radius: 12px;
      padding: 24px;
      color: #c0392b;
      font-size: 0.9rem;
      text-align: center;
    }

    /* ── Footer resources section ────────────────────────────────── */
    .faq-footer-resources strong {
      display: block;
      margin-bottom: 10px;
      color: #fff;
    }

    .faq-footer-resources a {
      display: block;
      color: rgba(255,255,255,0.7);
      font-size: 0.88rem;
      text-decoration: none;
      margin-bottom: 6px;
      transition: color .15s;
    }

    .faq-footer-resources a:hover { color: var(--terracotta); }
  </style>
</head>
<body>

  <!-- ── Header ──────────────────────────────────────────────────────── -->
  <header class="nx-header">
    <nav class="nx-nav">
      <a href="index.html" class="site-logo" aria-label="Nauxica home">
        <img src="assets/logo/nauxica-logo-horizontal.svg" alt="Nauxica" />
      </a>
      <button class="mobile-menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nx-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="help.html">Help Center</a></li>
        <li><a href="contacts.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- ── Hero ────────────────────────────────────────────────────────── -->
  <section class="faq-hero">
    <div class="faq-hero-inner">
      <div class="faq-breadcrumb">
        <a href="help.html">Help Center</a>
        <span class="faq-breadcrumb-sep">/</span>
        <span id="heroLabel">FAQ</span>
      </div>
      <h1 id="heroTitle">FAQ</h1>
      <p class="faq-hero-sub" id="heroSub"></p>
      <div class="faq-type-bar">
        <a class="faq-type-pill" href="faq-viewer.html?type=guest"      data-type="guest">Guest</a>
        <a class="faq-type-pill" href="faq-viewer.html?type=homeowner"  data-type="homeowner">Homeowner</a>
        <a class="faq-type-pill" href="faq-viewer.html?type=partner"    data-type="partner">Partner</a>
        <a class="faq-type-pill" href="faq-viewer.html?type=concierge"  data-type="concierge">Concierge</a>
      </div>
    </div>
  </section>

  <!-- ── FAQ body ────────────────────────────────────────────────────── -->
  <div class="faq-body">
    <div class="faq-wrap" id="faqContent">
      <div class="faq-loading">Loading…</div>
    </div>
  </div>

  <!-- ── Footer ──────────────────────────────────────────────────────── -->
  <footer>
    <div class="footer-inner">
      <img
        class="footer-logo"
        src="assets/logo/nauxica-logo-horizontal-white.svg"
        loading="lazy"
        alt="Nauxica"
      />
      <div>
        <strong>nauxicahq.com</strong><br />
        <a href="mailto:hello@nauxicahq.com">hello@nauxicahq.com</a><br />
        <small>Hospitality, connected.</small>
      </div>
      <div class="faq-footer-resources">
        <strong>Resources</strong>
        <a href="help.html">Help Center</a>
        <a href="help.html#faq">FAQ overview</a>
        <a href="faq-viewer.html?type=guest">Guest FAQ</a>
        <a href="faq-viewer.html?type=homeowner">Homeowner FAQ</a>
        <a href="faq-viewer.html?type=partner">Partner FAQ</a>
        <a href="faq-viewer.html?type=concierge">Concierge FAQ</a>
      </div>
      <div class="faq-footer-resources">
        <strong>Nauxica</strong>
        <a href="index.html">Home</a>
        <a href="index.html#services">Services</a>
        <a href="index.html#pricing">Pricing</a>
        <a href="contacts.html">Contact</a>
      </div>
    </div>
  </footer>

  <script>
    (function () {

      var FAQ_TYPES = {
        guest: {
          file:  'docs/faq/guest-faq.md',
          title: 'Guest FAQ',
          label: 'Guest FAQ',
          sub:   'Questions and answers for guests before, during and after their stay.'
        },
        homeowner: {
          file:  'docs/faq/homeowner-faq.md',
          title: 'Homeowner FAQ',
          label: 'Homeowner FAQ',
          sub:   'Managing properties, reservations, guests and operations with Nauxica.'
        },
        partner: {
          file:  'docs/faq/partner-faq.md',
          title: 'Partner FAQ',
          label: 'Partner FAQ',
          sub:   'Receiving, managing and completing operational work for hospitality properties.'
        },
        concierge: {
          file:  'docs/faq/concierge-faq.md',
          title: 'Concierge FAQ',
          label: 'Concierge FAQ',
          sub:   'About the Nauxica AI hospitality assistant and what it can do.'
        }
      };

      /* ── Escape HTML ──────────────────────────────────────────── */
      function esc(s) {
        if (!s) return '';
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      /* ── Parse FAQ markdown ────────────────────────────────────── */
      // Expected structure:
      //   # Title
      //   intro paragraph
      //   ---
      //   # Section Name
      //   ## Question
      //   Answer text (may include bullet lists)
      function parseFAQ(md) {
        var lines       = md.split('\n');
        var titleFound  = false;
        var introLines  = [];
        var introStopped = false;
        var sections    = [];
        var curSection  = null;
        var curItem     = null;

        function flushItem() {
          if (curItem && curSection) {
            curSection.items.push(curItem);
            curItem = null;
          }
        }

        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];

          // Page title — shown in hero, skip body rendering
          if (!titleFound && /^#\s/.test(line)) {
            titleFound = true;
            continue;
          }

          // Section heading (# not ##)
          if (/^#\s/.test(line)) {
            flushItem();
            introStopped = true;
            curSection = { heading: line.replace(/^#\s+/, '').trim(), items: [] };
            sections.push(curSection);
            continue;
          }

          // Question heading (##)
          if (/^##\s/.test(line)) {
            flushItem();
            introStopped = true;
            curItem = { q: line.replace(/^##\s+/, '').trim(), answerLines: [] };
            continue;
          }

          // Horizontal rule
          if (/^---/.test(line)) {
            introStopped = true;
            continue;
          }

          // Collect
          if (!introStopped) {
            introLines.push(line);
          } else if (curItem) {
            curItem.answerLines.push(line);
          }
        }

        flushItem();
        return { intro: introLines.join('\n').trim(), sections: sections };
      }

      /* ── Render answer lines to HTML ──────────────────────────── */
      function renderAnswer(answerLines) {
        var text   = answerLines.join('\n').trim();
        if (!text) return '';

        var blocks = text.split(/\n{2,}/);
        var html   = '';

        for (var b = 0; b < blocks.length; b++) {
          var block = blocks[b].trim();
          if (!block) continue;

          var blockLines = block.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);

          if (blockLines[0].charAt(0) === '-') {
            // Bullet list
            html += '<ul>';
            for (var k = 0; k < blockLines.length; k++) {
              if (blockLines[k].charAt(0) === '-') {
                html += '<li>' + esc(blockLines[k].slice(1).trim()) + '</li>';
              }
            }
            html += '</ul>';
          } else {
            html += '<p>' + esc(blockLines.join(' ')) + '</p>';
          }
        }

        return html;
      }

      /* ── Render parsed FAQ to DOM ─────────────────────────────── */
      function renderFAQ(parsed) {
        var html = '';

        if (parsed.intro) {
          html += '<p class="faq-intro-text">' + esc(parsed.intro) + '</p>';
        }

        for (var s = 0; s < parsed.sections.length; s++) {
          var section = parsed.sections[s];
          html += '<section class="faq-section">' +
            '<h2 class="faq-section-heading">' + esc(section.heading) + '</h2>';

          for (var q = 0; q < section.items.length; q++) {
            var item      = section.items[q];
            var answerHTML = renderAnswer(item.answerLines);
            html +=
              '<details class="faq-item">' +
                '<summary class="faq-question">' + esc(item.q) + '</summary>' +
                '<div class="faq-answer">' + answerHTML + '</div>' +
              '</details>';
          }

          html += '</section>';
        }

        return html || '<div class="faq-error">No content found.</div>';
      }

      /* ── Boot ─────────────────────────────────────────────────── */
      var params = new URLSearchParams(window.location.search);
      var type   = (params.get('type') || '').toLowerCase();
      var meta   = FAQ_TYPES[type];

      var contentEl = document.getElementById('faqContent');
      var titleEl   = document.getElementById('heroTitle');
      var labelEl   = document.getElementById('heroLabel');
      var subEl     = document.getElementById('heroSub');

      // Mark active type pill
      document.querySelectorAll('.faq-type-pill').forEach(function (pill) {
        if (pill.dataset.type === type) {
          pill.classList.add('active');
        }
      });

      if (!meta) {
        document.title = 'FAQ — Nauxica';
        titleEl.textContent = 'FAQ';
        subEl.textContent   = 'Choose a FAQ category above.';
        contentEl.innerHTML = '';
        return;
      }

      document.title        = meta.title + ' — Nauxica';
      titleEl.textContent   = meta.title;
      labelEl.textContent   = meta.label;
      subEl.textContent     = meta.sub;

      fetch(meta.file)
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.text();
        })
        .then(function (md) {
          var parsed = parseFAQ(md);
          contentEl.innerHTML = renderFAQ(parsed);
        })
        .catch(function (err) {
          contentEl.innerHTML =
            '<div class="faq-error">' +
              'Could not load FAQ content. ' +
              'If you are opening this file directly, please serve it from a local server.' +
            '</div>';
          console.error('FAQ load error:', err);
        });

    })();
  </script>

</body>
</html>
